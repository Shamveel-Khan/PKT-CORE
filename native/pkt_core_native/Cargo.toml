#
# Build file for the pkt_core_native accelerator (PyO3 + maturin).

[package]
name = "pkt-core-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-or-later"
description = "Optional Rust accelerator for pkt-core's crypto hot path (Twofish, Serpent, CAST-256)"
repository = "https://github.com/aacanadaa/packet-tracer-pkt-format"
publish = false

[lib]
name = "pkt_core_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros", "abi3-py310"] }

[features]
# "extension-module" is what maturin builds the wheel with (the symbols are
# provided by the Python interpreter at import time).  It must be optional so
# `cargo test` can link a standalone binary — see the Makefile's test target,
# which passes --no-default-features.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# The crate is pure computation + a thin Python wrapper; its own test suite is
# the KAT harness (`cargo test --no-default-features`).
