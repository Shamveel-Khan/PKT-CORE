!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
!
hostname SW1
!
enable secret 5 $1$mERr$Omj1/0mYxBCOg2lJkvLoh0
!
!
!
!
ip arp inspection vlan 1
!
ip dhcp snooping vlan 1
ip dhcp snooping
!
spanning-tree mode pvst
spanning-tree portfast default
spanning-tree extend system-id
!
interface FastEthernet0/1
 ip arp inspection trust
 ip dhcp snooping trust
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 000A.F336.4401
!
interface FastEthernet0/2
 ip arp inspection trust
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0060.3E09.9625
!
interface FastEthernet0/3
!
interface FastEthernet0/4
!
interface FastEthernet0/5
!
interface FastEthernet0/6
!
interface FastEthernet0/7
!
interface FastEthernet0/8
!
interface FastEthernet0/9
!
interface FastEthernet0/10
!
interface FastEthernet0/11
!
interface FastEthernet0/12
!
interface FastEthernet0/13
!
interface FastEthernet0/14
!
interface FastEthernet0/15
!
interface FastEthernet0/16
!
interface FastEthernet0/17
!
interface FastEthernet0/18
!
interface FastEthernet0/19
!
interface FastEthernet0/20
!
interface FastEthernet0/21
!
interface FastEthernet0/22
!
interface FastEthernet0/23
!
interface FastEthernet0/24
!
interface GigabitEthernet0/1
!
interface GigabitEthernet0/2
!
interface Vlan1
 ip address 192.168.1.2 255.255.255.0
!
banner motd # Authorized Access Only. All activities are logged. #
!
!
!
access-list 10 permit 192.168.1.0 0.0.0.255
access-list 10 permit 192.168.3.0 0.0.0.255
line con 0
 logging synchronous
 exec-timeout 5 0
!
line vty 0 4
 access-class 10 in
 exec-timeout 5 0
 login
 transport input ssh
line vty 5 15
 login
!
!
!
!
end
